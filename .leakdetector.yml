exclude_paths:
  - "node_modules/"
  - "site/node_modules/"
  - "site/dist/"
  - "go.sum"
  - "site/package-lock.json"
  - ".git/"
  - "coverage.out"
  - "*.out"

allowlists:
  - description: "Test database connection strings with dummy credentials"
    paths:
      - ".*_test\\.go$"
    stop_words:
      - "postgres:test@"
      - "nobody:nothing@"
      - "connect_timeout="
  - description: "Example API tokens in documentation and site pages"
    paths:
      - "docs/.*"
      - "site/src/pages/.*"
    stop_words:
      - "your-cloudflare-api-token"
      - "your-token"
      - "CF_API_TOKEN"
