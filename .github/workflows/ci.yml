name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io/phaseshiftdata
  SITE_DOMAIN: prometheus_exporters.phaseshiftdata.com

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Lint — Go vet, staticcheck, govulncheck, leakdetector
  # ──────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install C dependencies (libvirt for CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvirt-dev
      - name: Go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Staticcheck
        run: staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Govulncheck
        run: govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (may require Go patch release)"
        continue-on-error: true
      - name: Install leakdetector
        run: |
          curl -sL "https://github.com/asymmetric-effort/leakdetector/releases/latest/download/leakdetector_linux_amd64.tar.gz" | tar xz -C /usr/local/bin/
      - name: Run leakdetector
        run: |
          leakdetector --skip-history --format json --report ld-findings.json || true
          if [ -s ld-findings.json ] && [ "$(cat ld-findings.json)" != "null" ] && [ "$(cat ld-findings.json)" != "[]" ]; then
            echo "::error::leakdetector found potential secrets:"
            cat ld-findings.json
            exit 1
          fi
          echo "leakdetector: clean"

  # ──────────────────────────────────────────────────────────────────────
  # Test — unit, integration, coverage gate
  # ──────────────────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install C dependencies (libvirt for CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvirt-dev
      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v tests/container)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/testdb?sslmode=disable
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 98.0" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 98% threshold"
            exit 1
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ──────────────────────────────────────────────────────────────────────
  # Build — container images with tagging policy
  # ──────────────────────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install C dependencies (libvirt for CGO)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvirt-dev
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container images
        run: make build
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
      - name: Verify container image
        run: |
          IMAGE="${{ env.REGISTRY }}/cloudflare_exporter:${{ steps.tag.outputs.tag }}"
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Verifying image security posture..."
            # Verify non-root user
            USER=$(docker inspect --format='{{.Config.User}}' "$IMAGE")
            echo "Container user: $USER"
            # Verify no shell
            if docker run --rm --entrypoint /bin/sh "$IMAGE" -c "echo shell" 2>/dev/null; then
              echo "::error::Runtime image contains a shell (violates FR-8)"
              exit 1
            fi
            echo "No shell found in runtime image (FR-8 verified)"
            # Verify binary is statically linked
            docker run --rm --entrypoint /cloudflare_exporter "$IMAGE" --help 2>&1 || true
            echo "Container image verification passed"
          fi
      - name: Run molecule container tests
        run: go test -v -timeout 300s ./tests/container/...
      - name: Push container images
        if: github.event_name == 'push'
        run: make deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}

  # ──────────────────────────────────────────────────────────────────────
  # Site build — compile site and run pre-deployment e2e tests
  # ──────────────────────────────────────────────────────────────────────
  site-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install site dependencies
        run: cd site && npm install
      - name: Build site with relative base for blue-green
        run: cd site && npx vite build --base='./'
      - name: Write version marker for deployment verification
        run: echo "${{ github.sha }}" > site/dist/version.txt
      - name: Install Playwright
        run: cd site && npx playwright install --with-deps chromium
      - name: Run pre-deployment e2e tests
        run: cd site && npx playwright test e2e/site.spec.ts
      - name: Upload site build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: site/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────
  # Deploy staging — push new build to /staging/ on gh-pages branch
  # ──────────────────────────────────────────────────────────────────────
  deploy-staging:
    needs: site-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/download-artifact@v7
        with:
          name: site-build
          path: new-build
      - name: Deploy new build to /staging/
        run: |
          cd gh-pages
          rm -rf staging
          cp -r ../new-build staging
          touch .nojekyll
          echo "${{ env.SITE_DOMAIN }}" > CNAME
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Deploy staging from ${{ github.sha }}"
          git push origin gh-pages

  # ──────────────────────────────────────────────────────────────────────
  # PDV staging — verify staging before promoting to production
  # ──────────────────────────────────────────────────────────────────────
  pdv-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright
        run: cd site && npm install && npx playwright install --with-deps chromium
      - name: Wait for staging deploy to propagate
        run: |
          EXPECTED="${{ github.sha }}"
          echo "Waiting for staging to serve commit ${EXPECTED}..."
          for i in $(seq 1 60); do
            CACHEBUST="?cb=$(date +%s)-$i"
            VER=$(curl -sk "https://${{ env.SITE_DOMAIN }}/staging/version.txt${CACHEBUST}" 2>/dev/null | tr -d '[:space:]')
            if [ "$VER" = "$EXPECTED" ]; then
              echo "Staging confirmed after $((i*5))s"
              exit 0
            fi
            echo "Attempt $i/60: got=$VER"
            sleep 5
          done
          echo "ERROR: staging did not converge after 5 minutes"
          exit 1
      - name: Run PDV against staging
        run: cd site && npx playwright test --config=playwright.pdv.config.ts
        env:
          SITE_URL: https://${{ env.SITE_DOMAIN }}/staging/

  # ──────────────────────────────────────────────────────────────────────
  # Promote — copy staging to production (only after PDV passes)
  # ──────────────────────────────────────────────────────────────────────
  promote-to-production:
    needs: pdv-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - name: Promote staging to production root
        run: |
          cd gh-pages
          cp CNAME /tmp/CNAME.bak 2>/dev/null || true
          cp .nojekyll /tmp/.nojekyll.bak 2>/dev/null || true
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'staging' ! -name 'CNAME' ! -name '.nojekyll' -exec rm -rf {} +
          cp -r staging/* .
          cp /tmp/CNAME.bak CNAME 2>/dev/null || echo "${{ env.SITE_DOMAIN }}" > CNAME
          cp /tmp/.nojekyll.bak .nojekyll 2>/dev/null || touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Promote staging to production from ${{ github.sha }}"
          git push origin gh-pages

  # ──────────────────────────────────────────────────────────────────────
  # PDV production — verify production after promotion
  # ──────────────────────────────────────────────────────────────────────
  pdv-production:
    needs: promote-to-production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright
        run: cd site && npm install && npx playwright install --with-deps chromium
      - name: Wait for production deploy to propagate
        run: |
          EXPECTED="${{ github.sha }}"
          echo "Waiting for production to serve commit ${EXPECTED}..."
          for i in $(seq 1 60); do
            CACHEBUST="?cb=$(date +%s)-$i"
            VER=$(curl -sk "https://${{ env.SITE_DOMAIN }}/version.txt${CACHEBUST}" 2>/dev/null | tr -d '[:space:]')
            if [ "$VER" = "$EXPECTED" ]; then
              echo "Production confirmed after $((i*5))s"
              exit 0
            fi
            echo "Attempt $i/60: got=$VER"
            sleep 5
          done
          echo "ERROR: production did not converge after 5 minutes"
          exit 1
      - name: Run PDV against production
        run: cd site && npx playwright test --config=playwright.pdv.config.ts
        env:
          SITE_URL: https://${{ env.SITE_DOMAIN }}
