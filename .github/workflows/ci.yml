name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io/phaseshiftdata

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Lint — Go vet, staticcheck, govulncheck, leakdetector
  # ──────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Staticcheck
        run: staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Govulncheck
        run: govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (may require Go patch release)"
        continue-on-error: true
      - name: Install leakdetector
        run: |
          curl -sL "https://github.com/asymmetric-effort/leakdetector/releases/latest/download/leakdetector_linux_amd64.tar.gz" | tar xz -C /usr/local/bin/
      - name: Run leakdetector
        run: |
          leakdetector --skip-history --format json --report ld-findings.json || true
          if [ -s ld-findings.json ] && [ "$(cat ld-findings.json)" != "null" ] && [ "$(cat ld-findings.json)" != "[]" ]; then
            echo "::error::leakdetector found potential secrets:"
            cat ld-findings.json
            exit 1
          fi
          echo "leakdetector: clean"

  # ──────────────────────────────────────────────────────────────────────
  # Test — unit, integration, coverage gate
  # ──────────────────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 98.0" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 98% threshold"
            exit 1
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ──────────────────────────────────────────────────────────────────────
  # Build — container images with tagging policy
  # ──────────────────────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container images
        run: make build
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
      - name: Verify container image
        run: |
          IMAGE="${{ env.REGISTRY }}/cloudflare_exporter:${{ steps.tag.outputs.tag }}"
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Verifying image security posture..."
            # Verify non-root user
            USER=$(docker inspect --format='{{.Config.User}}' "$IMAGE")
            echo "Container user: $USER"
            # Verify no shell
            if docker run --rm --entrypoint /bin/sh "$IMAGE" -c "echo shell" 2>/dev/null; then
              echo "::error::Runtime image contains a shell (violates FR-8)"
              exit 1
            fi
            echo "No shell found in runtime image (FR-8 verified)"
            # Verify binary is statically linked
            docker run --rm --entrypoint /cloudflare_exporter "$IMAGE" --help 2>&1 || true
            echo "Container image verification passed"
          fi
      - name: Push container images
        if: github.event_name == 'push'
        run: make deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}

  # ──────────────────────────────────────────────────────────────────────
  # Site build — compile site, pre-deployment tests
  # ──────────────────────────────────────────────────────────────────────
  site-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install site dependencies
        run: cd site && npm install
      - name: Build site
        run: cd site && npx vite build
      - name: Install Playwright
        run: cd site && npx playwright install --with-deps chromium
      - name: Run pre-deployment e2e tests
        run: cd site && npx playwright test e2e/site.spec.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/

  # ──────────────────────────────────────────────────────────────────────
  # Deploy pages — publish to GitHub Pages (main only)
  # ──────────────────────────────────────────────────────────────────────
  deploy-pages:
    needs: site-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ──────────────────────────────────────────────────────────────────────
  # Post-deployment verification — Playwright PDV tests against live site
  # ──────────────────────────────────────────────────────────────────────
  post-deployment-verification:
    needs: deploy-pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright
        run: cd site && npm install && npx playwright install --with-deps chromium
      - name: Wait for deployment propagation
        run: |
          echo "Waiting 90s for CDN cache propagation..."
          sleep 90
      - name: Run post-deployment verification tests
        run: cd site && npx playwright test --config=playwright.pdv.config.ts
        env:
          SITE_URL: https://prometheus_exporters.phaseshiftdata.com
